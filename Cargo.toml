[package]
name = "namehealth"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "namehealth"
path = "src/collector/main.rs"

[dependencies]
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.98.0"
bytes = "1.10.1"
chrono = "0.4.42"
domain = { version = "0.11.1", features = ["resolv", "serde"] }
futures = "0.3.31"
once_cell = "1.21.3"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
