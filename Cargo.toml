[package]
name = "namehealth"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "namehealth"
path = "src/collector/main.rs"

[dependencies]
bytes = "1.10.1"
domain = { version = "0.11.1", features = ["resolv"] }
tokio = { version = "1.48.0", features = ["full"] }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.98.0"
chrono = "0.4.42"

serde_json = "1.0.145"
serde = "1.0.228"